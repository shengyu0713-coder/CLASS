<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班表管理系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg:#F6F5F0;
    --surface:#FFFFFF;
    --ink:#25302B;
    --ink-soft:#6E7871;
    --ink-faint:#9AA39C;
    --primary:#3D6B5C;
    --primary-dark:#2B4E43;
    --primary-soft:#DCEAE3;
    --accent:#C98A3E;
    --accent-soft:#F5E6CE;
    --danger:#B5504A;
    --danger-bg:#F8E4E2;
    --danger-strong:#95332E;
    --border:#E3E1DA;
    --border-soft:#EDEBE4;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .app{max-width:1400px;margin:0 auto;padding:18px 16px 60px;}
  .top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;margin-bottom:14px;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,var(--primary),var(--primary-dark));
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;flex-shrink:0;}
  .brand h1{font-family:'Noto Serif TC',serif;font-weight:700;font-size:21px;margin:0;color:var(--primary-dark);letter-spacing:.5px;}
  .brand .sub{font-size:12px;color:var(--ink-faint);}
  .month-picker{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 6px;}
  .month-picker button{width:28px;height:28px;border-radius:999px;border:none;background:transparent;color:var(--primary-dark);
    font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .month-picker button:hover{background:var(--primary-soft);}
  .month-picker .label{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;min-width:88px;text-align:center;color:var(--primary-dark);}
  nav.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px;overflow-x:auto;margin-bottom:16px;}
  nav.tabs button{border:none;background:transparent;padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:700;
    color:var(--ink-soft);cursor:pointer;white-space:nowrap;transition:.15s;}
  nav.tabs button.active{background:var(--primary);color:#fff;}
  nav.tabs button:not(.active):hover{background:var(--primary-soft);color:var(--primary-dark);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .card h2{font-family:'Noto Serif TC',serif;font-size:17px;margin:0 0 4px;color:var(--primary-dark);display:flex;align-items:center;gap:8px;}
  .card .desc{font-size:12.5px;color:var(--ink-faint);margin:0 0 14px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;}
  .pill.locked{background:var(--danger-bg);color:var(--danger-strong);}
  .pill.open{background:var(--primary-soft);color:var(--primary-dark);}
  .pill.warn{background:var(--accent-soft);color:#8A5A1E;}
  button.btn{font-family:inherit;font-weight:700;font-size:13px;padding:9px 16px;border-radius:8px;border:1px solid var(--primary);
    background:var(--primary);color:#fff;cursor:pointer;transition:.15s;}
  button.btn:hover{background:var(--primary-dark);}
  button.btn.ghost{background:transparent;color:var(--primary-dark);}
  button.btn.ghost:hover{background:var(--primary-soft);}
  button.btn.danger{background:var(--danger);border-color:var(--danger);}
  button.btn.danger:hover{background:var(--danger-strong);}
  button.btn.small{padding:6px 11px;font-size:12px;border-radius:7px;}
  button.btn:disabled{opacity:.45;cursor:not-allowed;}
  select, input[type=text], input[type=date], textarea{
    font-family:inherit;font-size:13px;padding:7px 9px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--ink);}
  select:focus, input:focus, textarea:focus{outline:2px solid var(--primary-soft);border-color:var(--primary);}
  label.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-soft);font-weight:700;}
  .table-scroll{overflow-x:auto;border:1px solid var(--border-soft);border-radius:8px;}
  table.grid{border-collapse:collapse;width:100%;min-width:900px;}
  table.grid th, table.grid td{border:1px solid var(--border-soft);padding:5px 6px;font-size:12px;text-align:center;white-space:nowrap;}
  table.grid thead th{background:var(--primary-soft);color:var(--primary-dark);font-weight:700;position:sticky;top:0;z-index:2;}
  table.grid th.rowlabel, table.grid td.rowlabel{position:sticky;left:0;background:#F2F1EB;z-index:1;text-align:left;font-weight:700;color:var(--ink-soft);min-width:110px;}
  table.grid thead th.rowlabel{z-index:3;}
  table.grid td.deadline{background:var(--accent-soft)!important;color:#8A5A1E;}
  table.grid .wd{font-size:10px;color:var(--ink-faint);display:block;font-weight:400;}
  table.grid td.leave-cell{font-size:11px;color:var(--ink-soft);text-align:left;max-width:150px;white-space:normal;}
  table.grid td.on-leave{background:var(--danger-bg);}
  table.grid td.on-leave select, table.grid td.on-leave{color:var(--danger-strong);font-weight:700;}
  table.grid select.cellsel{width:100%;min-width:64px;border:none;background:transparent;font-size:12px;text-align:center;padding:3px;}
  table.grid input.celltxt{width:100%;min-width:70px;border:none;background:transparent;font-size:12px;text-align:center;padding:3px;}
  table.grid td.readonly-cell{font-size:12px;}
  .cal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px;}
  .cal .d{border:1px solid var(--border);border-radius:8px;padding:8px 6px;text-align:center;cursor:pointer;background:#fff;position:relative;min-height:56px;}
  .cal .d .num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;}
  .cal .d .wd{font-size:10px;color:var(--ink-faint);}
  .cal .d.leave{background:var(--danger-bg);border-color:var(--danger);}
  .cal .d.leave .tag{font-size:9.5px;color:var(--danger-strong);font-weight:700;display:block;margin-top:2px;}
  .cal .d:hover{border-color:var(--primary);}
  .cal .d.disabled{opacity:.4;cursor:not-allowed;}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-faint);font-size:13px;}
  .empty .big{font-size:30px;margin-bottom:8px;}
  .list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border-soft);border-radius:8px;margin-bottom:8px;background:#FBFAF7;}
  .list-item .meta{font-size:12px;color:var(--ink-faint);}
  .list-item .name{font-weight:700;font-size:13.5px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media (max-width: 760px){
    .grid2, .grid3{grid-template-columns:1fr;}
    table.grid{min-width:1100px;}
    .cal{grid-template-columns:repeat(5,1fr);}
    .brand h1{font-size:17px;}
  }
  .swap-cand{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary-dark);
    padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;margin:3px 4px 0 0;}
  .swap-cand .x{cursor:pointer;color:var(--danger-strong);}
  .swap-cand .ud{cursor:pointer;color:var(--primary-dark);opacity:.7;}
  .swap-cand .ud:hover{opacity:1;}
  .badge{display:inline-block;padding:0 6px;border-radius:999px;font-size:10px;font-weight:700;margin-left:4px;vertical-align:middle;}
  .badge.a{background:#E4EEF6;color:#4C7EA8;}
  .badge.b{background:#EFE6F3;color:#8A5FA0;}
  .footer-note{font-size:11.5px;color:var(--ink-faint);text-align:center;margin-top:22px;line-height:1.7;}
  .flag{color:var(--danger-strong);font-weight:700;}
  .ok{color:var(--primary-dark);font-weight:700;}
  hr.sep{border:none;border-top:1px solid var(--border-soft);margin:16px 0;}
  .tiny{font-size:11.5px;color:var(--ink-faint);}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:#fff;
    padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.2);
    z-index:50;opacity:0;pointer-events:none;transition:.25s;}
  .toast.show{opacity:1;transform:translate(-50%,-6px);}
  .grouplist{min-height:32px;}
  .print-title{display:none;}
  @media print{
    body{background:#fff;}
    .app{max-width:100%;padding:0;}
    .no-print, nav.tabs, .month-picker, .footer-note, button, select.cellsel{display:none!important;}
    input.celltxt{border:none!important;background:transparent!important;color:#000!important;padding:1px!important;}
    .print-title{display:block;font-family:'Noto Serif TC',serif;font-size:22px;font-weight:700;margin-bottom:10px;color:#000;}
    .card{border:1px solid #ccc;box-shadow:none;padding:8px;margin-bottom:8px;break-inside:avoid;}
    .card h2{color:#000;}
    .card .desc{display:none;}
    table.grid{font-size:10px;min-width:0;width:100%;table-layout:fixed;}
    table.grid th, table.grid td{padding:3px 4px;overflow-wrap:break-word;word-break:break-word;}
    table.grid thead th{background:#eee!important;color:#000!important;position:static;}
    table.grid td.rowlabel, table.grid th.rowlabel{background:#f5f5f5!important;position:static;font-size:11px;width:90px;}
    .table-scroll{overflow:visible;border:none;}
    td.on-leave{background:#fdd!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    td.deadline{background:#fde9c8!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .badge{border:1px solid #999;}
    @page{size:A3 landscape;margin:14mm 12mm;}
    body.print-compact .extra-detail{display:none!important;}
    body.print-compact .print-title{font-size:26px;margin-bottom:14px;}
    body.print-compact table.grid{font-size:15px;}
    body.print-compact table.grid th, body.print-compact table.grid td{padding:5px 6px;}
    body.print-compact table.grid td.rowlabel, body.print-compact table.grid th.rowlabel{font-size:14px;width:105px;}
    body.print-compact .card h2{font-size:18px;}
    body.print-compact .badge{font-size:12px;padding:1px 8px;}
  }
</style>
</head>

<script type="module">
/* ============ Firebase Firestore 雲端儲存(跨裝置同步共用) ============ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDbAJDGaOhdpso_Lz3VfuaiyzjJT1YsQWs",
  authDomain: "class-753bc.firebaseapp.com",
  projectId: "class-753bc",
  storageBucket: "class-753bc.firebasestorage.app",
  messagingSenderId: "63017816894",
  appId: "1:63017816894:web:c93afbf8aa648efd25526f",
  measurementId: "G-6CYEYEWKLE"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const COLLECTION = 'schedule-app-data';

window.storage = {
  async get(key, shared){
    const ref = doc(db, COLLECTION, key);
    const snap = await getDoc(ref);
    if(!snap.exists()) throw new Error('Key not found: '+key);
    return {key, value: snap.data().value, shared};
  },
  async set(key, value, shared){
    const ref = doc(db, COLLECTION, key);
    await setDoc(ref, {value, shared: !!shared, updatedAt: Date.now()});
    return {key, value, shared};
  },
  async delete(key, shared){
    const ref = doc(db, COLLECTION, key);
    await deleteDoc(ref);
    return {key, deleted:true, shared};
  },
  async list(prefix, shared){
    const col = collection(db, COLLECTION);
    const snap = await getDocs(col);
    const keys = [];
    snap.forEach(d=>{ if(!prefix || d.id.indexOf(prefix)===0) keys.push(d.id); });
    return {keys, prefix, shared};
  }
};

// 通知主程式:雲端儲存已經準備好,可以開始執行 init()
window.__storageReady = true;
window.dispatchEvent(new Event('storage-ready'));
</script>

// 行政院人事行政總處公告之國定假日(2026年起不再補班,假日逢週末以補假處理,故僅列出實際會落在平日的假日)
const BUILTIN_HOLIDAYS = [
  '2026-01-01', // 元旦
  '2026-02-16','2026-02-17','2026-02-18','2026-02-19','2026-02-20', // 農曆春節
  '2026-02-27', // 和平紀念日(228)補假

  '2026-09-25','2026-09-28', // 中秋節/教師節
  '2026-10-09', // 國慶日
  '2026-10-26', // 臺灣光復節
  '2026-12-25', // 行憲紀念日
  '2027-01-01' // 元旦(次年)
];

/* ============ 全域狀態 ============ */
let state = {
  ready:false,
  ym: currentYM(),
  activeTab:'overview',
  staff:[],
  month:null,
  tempLeaves:[],
  currentUserId:'',
  isAdmin:false,
  adminPin: DEFAULT_PIN,
  minStaff: DEFAULT_MIN_STAFF,
  rotationOffsets: {},
  customHolidays: [],
};

function currentYM(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function ymParts(ym){ const [y,m] = ym.split('-').map(Number); return {y, m}; }
function ymLabel(ym){ const {y,m} = ymParts(ym); return y+' 年 '+m+' 月'; }
function shiftYM(ym, delta){
  let {y,m} = ymParts(ym); m += delta;
  while(m>12){m-=12;y++;} while(m<1){m+=12;y--;}
  return y+'-'+String(m).padStart(2,'0');
}
function isHoliday(dateStr){
  return BUILTIN_HOLIDAYS.includes(dateStr) || state.customHolidays.includes(dateStr);
}
function weekdayDates(ym){
  const {y,m} = ymParts(ym);
  const last = new Date(y,m,0).getDate();
  const out = [];
  for(let d=1; d<=last; d++){
    const dt = new Date(y,m-1,d);
    const wd = dt.getDay();
    if(wd===0||wd===6) continue;
    const dateStr = y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    if(isHoliday(dateStr)) continue;
    out.push({date: dateStr, day:d, wd: WD[wd]});
  }
  return out;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function staffName(id){ const s = state.staff.find(x=>x.id===id); return s ? s.name : (id||''); }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36); }
function idsFromNames(names){ return names.map(n=>{const s=state.staff.find(x=>x.name===n); return s?s.id:null;}).filter(Boolean); }

/* ============ Storage 存取 ============ */
let _storageWarningShown = false;
function showStorageUnavailableWarning(){

async function safeGet(key, shared, retries){
  if(!window.storage || typeof window.storage.get !== 'function'){
    showStorageUnavailableWarning();
    return null;
  }
  retries = retries===undefined ? 1 : retries;
  for(let attempt=0; attempt<=retries; attempt++){
    try{
      const r = await window.storage.get(key, shared);
      return r ? r.value : null;
    }catch(e){
      if(attempt<retries){ await new Promise(res=>setTimeout(res,300)); continue; }
      console.error('storage get failed after retry', key, e);
      return null;
    }
  }
  return null;
}
async function safeSet(key, value, shared, retries){
  if(!window.storage || typeof window.storage.set !== 'function'){
    showStorageUnavailableWarning();
    return false;
  }
  retries = retries===undefined ? 1 : retries;
  for(let attempt=0; attempt<=retries; attempt++){
    try{
      await window.storage.set(key, value, shared);
      return true;
    }catch(e){
      if(attempt<retries){ await new Promise(res=>setTimeout(res,400)); continue; }
      console.error('storage set failed after retry', key, e);
      alert('⚠️ 儲存失敗!\n\n剛才的異動可能沒有真的存進雲端,請檢查網路連線後重新操作一次,並在重新整理頁面後確認資料是否正確。\n\n(錯誤訊息: '+(e && e.message ? e.message : e)+')');
      return false;
    }
  }
  return false;
}

/* ============ 輪值計算 ============ */
// 全月週期索引(跨月連續累計,不會每月重置,避免名單後段的人永遠輪不到)
const ROTATION_EPOCH = new Date(2025,0,6); // 2025-01-06 為星期一,作為連續輪值的起算基準
function countWeekdaysInclusive(start, end){
  const days = Math.round((end-start)/86400000)+1;
  if(days<=0) return 0;
  const weeks = Math.floor(days/7);
  let count = weeks*5;
  const remainder = days%7;
  const startWd = start.getDay();
  for(let i=0;i<remainder;i++){
    const d = (startWd+i)%7;
    if(d!==0 && d!==6) count++;
  }
  return count;
}
function globalWeekdayIndex(dateStr){
  const target = new Date(dateStr+'T00:00:00');
  if(target < ROTATION_EPOCH) return 0;
  return countWeekdaysInclusive(ROTATION_EPOCH, target) - 1;
}
function globalWeekIndex(dateStr){
  const idx = globalWeekdayIndex(dateStr);
  return idx<0 ? 0 : Math.floor(idx/5);
}
function weekdayIndexInMonth(date){
  const dates = weekdayDates(date.slice(0,7));
  return dates.findIndex(d=>d.date===date);
}
function weekIndexInMonth(date){
  const idx = weekdayIndexInMonth(date);
  return idx<0 ? 0 : Math.floor(idx/5);
}
function selectFromRoster(rosterArr, baseIdx, avoidIds, date){
  if(!rosterArr || rosterArr.length===0 || baseIdx<0) return '';
  const avoid = avoidIds || [];
  for(let attempt=0; attempt<rosterArr.length; attempt++){
    const candidate = rosterArr[(baseIdx+attempt) % rosterArr.length];
    if(avoid.includes(candidate)) continue;
    if(leaveInfoFor(candidate, date).onLeave) continue;
    return candidate;
  }
  // 名單裡沒有人同時符合「沒請假」且「沒被排去做同一時段的其他工作」,留空,畫面會標紅提示人力不足
  return '';
}
const LUNCH_GROUPS = { A:['lunch1F_A','lunch2F_A','lunch3F_A'], B:['lunch1F_B','lunch2F_B','lunch3F_B'] };
const ROSTER_FREQ = {};
ROTATION_ROWS.forEach(r=>{ if(!(r.roster in ROSTER_FREQ)) ROSTER_FREQ[r.roster] = r.freq; });
function rosterOffset(rosterKey){ return state.rotationOffsets[rosterKey] || 0; }
function computeRotation(row, date){
  if(row.freq==='week'){
    const idx = globalWeekIndex(date) + rosterOffset(row.roster);
    return selectFromRoster(state.month.rosters[row.roster], idx, [], date);
  }
  if(row.freq==='lunch'){
    const floorMembers = state.month.groups[FLOOR_GROUP_KEY[row.floor]] || [];
    const presentInTeam = (teamKey)=> floorMembers.filter(id=>{
      const wantTeam = teamKey==='shiftA' ? 'A' : 'B';
      if(effectiveTeamOnDate(id, date) !== wantTeam) return false;
      return !leaveInfoFor(id, date).onLeave;
    }).length;
    // A班支援:A班人員中午離開用餐,檢查樓層剩下的B班在場人數夠不夠2人
    // B班支援:B班人員中午離開用餐,檢查樓層剩下的A班在場人數夠不夠2人
    const presentCount = row.team==='A' ? presentInTeam('shiftB') : presentInTeam('shiftA');
    const needed = Math.max(0, LUNCH_MIN_PRESENT - presentCount);
    if(needed < 1) return null; // 該方向在場人數已足夠2人,不需要這個名額支援

    const baseIdx = globalWeekdayIndex(date) + rosterOffset(row.roster);
    const group = LUNCH_GROUPS[row.team] || [];
    const myPos = group.indexOf(row.key);
    const avoidIds = [];
    for(let i=0;i<myPos;i++){
      const otherRow = ROTATION_ROWS.find(r=>r.key===group[i]);
      const v = otherRow ? effectiveRotation(otherRow, date) : '';
      if(v) avoidIds.push(v);
    }
    return selectFromRoster(state.month.rosters[row.roster], baseIdx+row.offset, avoidIds, date);
  }
  if(row.freq==='day'){
    const baseIdx = globalWeekdayIndex(date) + rosterOffset(row.roster);
    const avoidIds = (CONFLICT_PAIRS[row.key]||[]).map(k=>{
      const pairRow = ROTATION_ROWS.find(r=>r.key===k);
      return pairRow ? effectiveRotation(pairRow, date) : '';
    }).filter(Boolean);
    if(ESCORT_ORDER.includes(row.key)){
      const myIdx = ESCORT_ORDER.indexOf(row.key);
      for(let i=0;i<myIdx;i++){
        const otherRow = ROTATION_ROWS.find(r=>r.key===ESCORT_ORDER[i]);
        const v = otherRow ? effectiveRotation(otherRow, date) : '';
        if(v) avoidIds.push(v);
      }
    }
    return selectFromRoster(state.month.rosters[row.roster], baseIdx, avoidIds, date);
  }
  return '';
}
// 每日輪值(值週/跟車)整月排定,並記錄「因請假而代班」的公平記帳(僅限當月內,代班者之後會被跳過一次把班還回去)
const DAY_ORDER = ['dutyA','dutyB', ...ESCORT_ORDER];
function buildDayRotationSchedule(){
  const dates = weekdayDates(state.ym);
  const credit = {}; // credit[rosterKey][staffId] = 欠他的補休次數
  const creditOf = (rk,id)=> (credit[rk] && credit[rk][id]) || 0;
  const addCredit = (rk,id)=>{ credit[rk]=credit[rk]||{}; credit[rk][id]=(credit[rk][id]||0)+1; };
  const useCredit = (rk,id)=>{ credit[rk]=credit[rk]||{}; credit[rk][id]=(credit[rk][id]||0)-1; };
  const schedule = {};
  DAY_ORDER.forEach(k=> schedule[k] = {});

  dates.forEach(d=>{
    const dayAssign = {};
    DAY_ORDER.forEach(rowKey=>{
      const row = ROTATION_ROWS.find(r=>r.key===rowKey);
      if(!row) return;
      if(hasOverride(rowKey, d.date)){ dayAssign[rowKey] = state.month.assign[rotKey(rowKey,d.date)]; return; }
      const rosterArr = state.month.rosters[row.roster] || [];
      const n = rosterArr.length;
      if(n===0){ dayAssign[rowKey] = ''; return; }
      const rawIdx = globalWeekdayIndex(d.date) + rosterOffset(row.roster);
      const naturalIdx = ((rawIdx % n) + n) % n;

      const avoidIds = (CONFLICT_PAIRS[rowKey]||[]).map(k=>dayAssign[k]).filter(Boolean);
      if(ESCORT_ORDER.includes(rowKey)){
        const myPos = ESCORT_ORDER.indexOf(rowKey);
        for(let i=0;i<myPos;i++){ const v = dayAssign[ESCORT_ORDER[i]]; if(v) avoidIds.push(v); }
      }

      let selected = '';
      let leaveSkipHappened = false;
      for(let attempt=0; attempt<n; attempt++){
        const cand = rosterArr[(naturalIdx+attempt) % n];
        if(avoidIds.includes(cand)) continue;
        if(attempt===0){
          if(leaveInfoFor(cand, d.date).onLeave){ leaveSkipHappened = true; continue; }
          if(creditOf(row.roster, cand) > 0){ useCredit(row.roster, cand); continue; }
          selected = cand; break;
        } else {
          if(leaveInfoFor(cand, d.date).onLeave) continue;
          selected = cand; break;
        }
      }
      if(!selected){
        selected = '';
      }

      if(selected && leaveSkipHappened && selected !== rosterArr[naturalIdx]){
        addCredit(row.roster, selected);
      }
      dayAssign[rowKey] = selected;
    });
    DAY_ORDER.forEach(rowKey=>{ schedule[rowKey][d.date] = dayAssign[rowKey]; });
  });
  return schedule;
}
let _dayScheduleCache = null;
let _dayScheduleCacheYm = null;
function getDaySchedule(){
  if(_dayScheduleCache && _dayScheduleCacheYm===state.ym) return _dayScheduleCache;
  _dayScheduleCache = buildDayRotationSchedule();
  _dayScheduleCacheYm = state.ym;
  return _dayScheduleCache;
}
function invalidateDaySchedule(){ _dayScheduleCache = null; }

function rotKey(rowKey, date){ return 'rot|'+rowKey+'|'+date; }
function effectiveRotation(row, date){
  const k = rotKey(row.key, date);
  if(state.month.assign[k]) return state.month.assign[k];
  if(row.freq==='day') return (getDaySchedule()[row.key]||{})[date] || '';
  return computeRotation(row, date);
}
function hasOverride(rowKey, date){ return !!state.month.assign[rotKey(rowKey,date)]; }
function setOverride(rowKey, date, staffId){
  const k = rotKey(rowKey,date);
  if(staffId) state.month.assign[k] = staffId; else delete state.month.assign[k];
}

// 找出某員工在某日被排到哪些輪值項目(用於臨時請假找代理)
function rotationsOf(staffId, date){
  const res = [];
  ROTATION_ROWS.forEach(row=>{
    if(row.key==='cooking') return; // 煮飯為整週,不做單日代理
    if(effectiveRotation(row, date)===staffId) res.push(row);
  });
  return res;
}
function busyStaffIdsOn(date){
  const set = new Set();
  ROTATION_ROWS.forEach(row=>{ const v = effectiveRotation(row,date); if(v) set.add(v); });
  return set;
}

// 該日該班別(依 A/B 班別分組,已考慮調班)實際到班人數(扣除請假) — 見下方定義
function understaffedList(ym){
  const dates = weekdayDates(ym);
  const out = [];
  dates.forEach(d=>{
    ['A','B'].forEach(team=>{
      const c = teamHeadcount(team, d.date);
      if(c < state.minStaff) out.push({date:d.date, day:d.day, wd:d.wd, team, count:c});
    });
  });
  return out;
}
function shortageWarningHTML(){
  const list = understaffedList(state.ym);
  if(list.length===0) return '';
  return `<div class="card" style="border-color:var(--danger);background:var(--danger-bg);">
    <h2 style="color:var(--danger-strong);">⚠ 人力不足警示(低於最低 ${state.minStaff} 人)</h2>
    <div class="desc" style="color:var(--danger-strong);">以下日期班別人力不足,請儘速通知主管協調支援。</div>
    ${list.map(x=>`<div class="list-item" style="background:#fff;">
      <div><span class="name">${state.ym.split('-')[1]}/${x.day}(${x.wd}) — ${x.team}班</span></div>
      <div class="flag">目前僅 ${x.count} 人 / 最低需 ${state.minStaff} 人</div>
    </div>`).join('')}
  </div>`;
}
function teamOfStaff(staffId){
  if((state.month.groups.shiftA||[]).includes(staffId)) return 'A';
  if((state.month.groups.shiftB||[]).includes(staffId)) return 'B';
  return null;
}
function swapFor(staffId, date){
  return (state.month.shiftSwaps||[]).find(s=>s.date===date && s.staffId===staffId) || null;
}
function effectiveTeamOnDate(staffId, date){
  const s = swapFor(staffId, date);
  if(!s) return teamOfStaff(staffId);
  const original = teamOfStaff(staffId);
  return original==='A' ? 'B' : (original==='B' ? 'A' : original);
}
function teamHeadcount(team, date){
  const allIds = [...(state.month.groups.shiftA||[]), ...(state.month.groups.shiftB||[])];
  return allIds.filter(id=>!leaveInfoFor(id,date).onLeave && effectiveTeamOnDate(id,date)===team).length;
}
function teamBadge(staffId){
  const t = teamOfStaff(staffId);
  return t ? `<span class="badge ${t==='A'?'a':'b'}">${t}</span>` : '';
}
function checkShortageAndAlert(date, team){
  if(!team) return;
  const c = teamHeadcount(team, date);
  if(c < state.minStaff){
    alert('⚠️ 人力不足提醒\n\n'+date+'（'+team+'班）目前僅剩 '+c+' 人,低於最低 '+state.minStaff+' 人門檻。\n請務必通知主管協調支援!');
  }
}

    </tr></thead><tbody>
    ${state.month.sharedRows.map(row=>`<tr><td class="rowlabel">${row} <span class="x" style="font-weight:400;" data-del-row="${row}">✕</span></td>
      ${dates.map(d=>{
        const v = state.month.sharedCell[row+'|'+d.date] || '';
        return `<td><input class="celltxt" type="text" value="${v.replace(/"/g,'&quot;')}" data-shared="${row}|${d.date}"></td>`;
      }).join('')}</tr>`).join('')}
    </tbody></table></div>
  </div>`;
  return html;
}

/* ============ Tab: 臨時請假 / 換班支援 ============ */
function renderTemp(){
  if(state.staff.length===0){
    return `<div class="card"><div class="empty"><div class="big">🗂️</div>尚未建立同仁名單,請先到「排班管理」新增人員。</div></div>`;
  }
  const staffOpts = '<option value="">— 選擇同仁 —</option>' + state.staff.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  let html = `<div class="card">
    <h2>登記臨時請假</h2>
    <div class="desc">用於突發、非事先排定的請假。登記後系統會自動列出當日還能支援的同仁。</div>
    <div class="row">
      <label class="field">同仁<select id="tlStaff">${staffOpts}</select></label>
      <label class="field">日期<input type="date" id="tlDate"></label>
      <label class="field">假別<select id="tlType">${LEAVE_TYPES.map(t=>`<option value="${t.label.charAt(0)}">${t.label}</option>`).join('')}</select></label>
      <label class="field">時段<select id="tlPeriod">${LEAVE_PERIODS.map(p=>`<option value="${p.code}">${p.label}</option>`).join('')}</select></label>
      <label class="field">備註<input type="text" id="tlNote" placeholder="選填" style="width:140px;"></label>
    </div>
    <button class="btn" style="margin-top:12px;" id="tlSubmit">送出臨時請假</button>
  </div>`;

  const items = state.tempLeaves.slice().sort((a,b)=> (b.ts||0)-(a.ts||0));
  html += `<div class="card"><h2>臨時請假紀錄</h2><div class="desc">紅字表示尚未安排支援;已安排者會顯示支援人員。</div>`;
  if(items.length===0){
    html += `<div class="tiny">目前沒有臨時請假紀錄</div>`;
  } else {
    items.forEach(t=>{
      const rotations = rotationsOf(t.staffId, t.date);
      const busy = busyStaffIdsOn(t.date);
      const candidates = state.staff.filter(s=> s.id!==t.staffId && !busy.has(s.id) && !leaveInfoFor(s.id,t.date).onLeave);
      html += `<div class="list-item" style="align-items:flex-start;flex-direction:column;">
        <div class="row" style="width:100%;justify-content:space-between;">
          <div><span class="name">${staffName(t.staffId)}</span> <span class="meta">${t.date}・${t.type||''}${t.period||''}${t.note?('・'+t.note):''}</span></div>
          <div>${t.status==='covered'
            ? `<span class="pill open">已由 ${staffName(t.coverStaffId)} 支援</span>`
            : `<span class="pill locked">尚未安排支援</span>`}</div>
        </div>
        ${rotations.length? `<div class="tiny" style="margin-top:6px;">⚠ 此人今天原本被排定:<b>${rotations.map(r=>r.label).join('、')}</b>(值週/跟車/中午支援都會自動列在這裡)</div>` : `<div class="tiny" style="margin-top:6px;">今天沒有排定值週、跟車或中午支援,純粹請假不影響輪值。</div>`}
        ${t.status!=='covered' ? `
          <div style="margin-top:8px;width:100%;">
            <div class="tiny" style="margin-bottom:4px;">當日可支援人選(未排其他輪值、未請假):</div>
            ${candidates.length? candidates.map(c=>`<span class="swap-cand">${c.name}</span>`).join('') : '<span class="tiny">目前找不到可支援的人員,請人工協調。</span>'}
            <div class="row" style="margin-top:8px;">
              <select id="coverSel-${t.id}"><option value="">選擇支援人員</option>${candidates.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
              <button class="btn small" data-mark-covered="${t.id}">標記已安排支援</button>
              ${rotations.length? `<span class="tiny">(若選擇支援人員,將自動遞補原輪值)</span>`:''}
            </div>
          </div>
        ` : ''}
        <div class="row" style="margin-top:6px;"><button class="btn ghost small" data-del-temp="${t.id}">刪除紀錄</button></div>
      </div>`;
    });
  }
  html += `</div>`;
  return html;
}

/* ============ 事件綁定 ============ */
function bindGlobalEvents(){
  document.getElementById('prevM').onclick = async ()=>{
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    await new Promise(r=>setTimeout(r,0));
    state.ym = shiftYM(state.ym,-1); await loadAllForMonth();
    if(state.lastMonthLoadWasEmpty) toast('這個月份目前沒有讀到已存資料,如果你確定之前有填過,請重新整理頁面再切換一次');
    render();
  };
  document.getElementById('nextM').onclick = async ()=>{
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    await new Promise(r=>setTimeout(r,0));
    state.ym = shiftYM(state.ym,1); await loadAllForMonth();
    if(state.lastMonthLoadWasEmpty) toast('這個月份目前沒有讀到已存資料,如果你確定之前有填過,請重新整理頁面再切換一次');
    render();
  };
  document.querySelectorAll('nav.tabs button').forEach(b=>{ b.onclick = ()=>{ state.activeTab = b.dataset.tab; render(); }; });
}
function bindTabEvents(){
  if(state.activeTab==='overview') bindOverview();
  if(state.activeTab==='myleave') bindMyLeave();
  if(state.activeTab==='admin') bindAdmin();
  if(state.activeTab==='temp') bindTemp();
}
function bindOverview(){
  const printCompactBtn = document.getElementById('printCompactBtn');
  if(printCompactBtn) printCompactBtn.onclick = ()=>{
    document.body.classList.add('print-compact');
    window.print();
  };
  const printFullBtn = document.getElementById('printFullBtn');
  if(printFullBtn) printFullBtn.onclick = ()=>{
    document.body.classList.remove('print-compact');
    window.print();
  };
  document.querySelectorAll('.celltxt[data-shared]').forEach(el=>{
    el.onchange = async ()=>{
      const key = el.dataset.shared;
      state.month.sharedCell[key] = el.value;
      await saveMonth();
      toast('已儲存');
    };
  });
}
function bindMyLeave(){
  const sel = document.getElementById('myLeaveUser');
  if(sel) sel.onchange = ()=>{ state.currentUserId = sel.value; render(); };
  document.querySelectorAll('.cal .d').forEach(el=>{
    el.onclick = ()=>{
      if(state.month.locked) { toast('本月已鎖定,無法自行修改,請使用臨時請假'); return; }
      if(!state.currentUserId){ toast('請先選擇姓名'); return; }
      openLeaveModal(el.dataset.date);
    };
  });
  document.querySelectorAll('[data-remove-leave]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.dataset.removeLeave;
      const arr = state.month.leaves[state.currentUserId]||[];
      state.month.leaves[state.currentUserId] = arr.filter(l=>l.id!==id);
      await saveMonth();
      toast('已取消該筆請假');
      render();
    };
  });
}
function openLeaveModal(date){
  const host = document.getElementById('leaveModalHost');
  host.innerHTML = leaveModal(date);
  document.getElementById('lmCancel').onclick = ()=>{ host.innerHTML=''; };
  document.getElementById('lmSave').onclick = async ()=>{
    const type = document.getElementById('lmType').value;
    const period = document.getElementById('lmPeriod').value;
    if(!state.month.leaves[state.currentUserId]) state.month.leaves[state.currentUserId] = [];
    const arr = state.month.leaves[state.currentUserId];
    const existingIdx = arr.findIndex(l=>l.date===date);
    const rec = {id: existingIdx>=0? arr[existingIdx].id : uid(), date, type, period};
    if(existingIdx>=0) arr[existingIdx] = rec; else arr.push(rec);
    await saveMonth();
    toast('已儲存請假申請');
    host.innerHTML='';
    checkShortageAndAlert(date, teamOfStaff(state.currentUserId));
    render();
  };
}
function bindAdmin(){
  const pinSubmit = document.getElementById('pinSubmit');
  if(pinSubmit){
    pinSubmit.onclick = async ()=>{
      const v = document.getElementById('pinInput').value;
      await loadAdminPin();
      if(v === state.adminPin){ state.isAdmin = true; render(); } else toast('密碼錯誤');
    };
    return;
  }
  const lockBtn = document.getElementById('lockBtn');
  if(lockBtn) lockBtn.onclick = async ()=>{ state.month.locked = true; await saveMonth(); toast('已鎖定本月班表'); render(); };
  const unlockBtn = document.getElementById('unlockBtn');
  if(unlockBtn) unlockBtn.onclick = async ()=>{ state.month.locked = false; await saveMonth(); toast('已解除鎖定'); render(); };
  const logoutBtn = document.getElementById('logoutAdminBtn');
  if(logoutBtn) logoutBtn.onclick = ()=>{ state.isAdmin = false; render(); };
  const changePinBtn = document.getElementById('changePinBtn');
  if(changePinBtn) changePinBtn.onclick = async ()=>{
    const np = prompt('請輸入新的管理密碼');
    if(np){ state.adminPin = np; await safeSet('admin-pin', np, true); toast('已更新管理密碼'); }
  };
  const saveMinStaffBtn = document.getElementById('saveMinStaffBtn');
  if(saveMinStaffBtn) saveMinStaffBtn.onclick = async ()=>{
    const v = Number(document.getElementById('minStaffInput').value);
    if(!v || v<1){ toast('請輸入有效的人數'); return; }
    state.minStaff = v; await safeSet('min-staff', String(v), true);
    toast('已更新最低人力門檻為 '+v+' 人'); render();
  };
  const copyPrevBtn = document.getElementById('copyPrevBtn');
  if(copyPrevBtn) copyPrevBtn.onclick = async ()=>{
    const prevYm = shiftYM(state.ym, -1);
    const prevRaw = await safeGet('month:'+prevYm, true);
    if(!prevRaw){ toast('上個月沒有可複製的資料'); return; }
    const prev = JSON.parse(prevRaw);
    if(!confirm('將複製上個月的固定分組與輪值順序名單(不含休假紀錄),確定要繼續嗎?')) return;
    state.month.groups = JSON.parse(JSON.stringify(prev.groups || emptyGroups()));
    state.month.rosters = JSON.parse(JSON.stringify(prev.rosters || emptyRosters()));
    state.month.sharedRows = (prev.sharedRows || DEFAULT_SHARED_ROWS).slice();
    await saveMonth();
    toast('已複製上個月的固定分組與輪值名單');
    render();
  };
  const swapShiftBtn = document.getElementById('swapShiftBtn');
  if(swapShiftBtn) swapShiftBtn.onclick = async ()=>{
    if(!confirm('將把目前 A 班與 B 班的人員名單整組互換(含值週、跟車、中午支援對應名單),僅影響本月,確定要繼續嗎?')) return;
    const g = state.month.groups; [g.shiftA, g.shiftB] = [g.shiftB, g.shiftA];
    const r = state.month.rosters;
    [r.dutyA, r.dutyB] = [r.dutyB, r.dutyA];
    [r.escortA, r.escortB] = [r.escortB, r.escortA];
    [r.lunchA, r.lunchB] = [r.lunchB, r.lunchA];
    await saveMonth(); toast('已互換 A／B 班別與對應輪值名單(僅本月)'); render();
  };

  const addHolidayBtn = document.getElementById('addHolidayBtn');
  if(addHolidayBtn) addHolidayBtn.onclick = async ()=>{
    const v = document.getElementById('newHoliday').value;
    if(!v){ toast('請選擇日期'); return; }
    if(!state.customHolidays.includes(v)) state.customHolidays.push(v);
    await saveCustomHolidays();
    toast('已新增假日'); render();
  };
  document.querySelectorAll('[data-del-holiday]').forEach(el=>{
    el.onclick = async ()=>{
      state.customHolidays = state.customHolidays.filter(d=>d!==el.dataset.delHoliday);
      await saveCustomHolidays();
      render();
    };
  });

  const addStaffBtn = document.getElementById('addStaffBtn');
  if(addStaffBtn) addStaffBtn.onclick = async ()=>{
    const name = document.getElementById('newStaffName').value.trim();
    if(!name){ toast('請輸入姓名'); return; }
    state.staff.push({id:uid(), name});
    await saveStaff(); render();
  };
  document.querySelectorAll('[data-del-staff]').forEach(el=>{
    el.onclick = async ()=>{
      if(!confirm('確定要移除此人員嗎?(不會刪除歷史排班紀錄)')) return;
      state.staff = state.staff.filter(s=>s.id!==el.dataset.delStaff);
      await saveStaff(); render();
    };
  });

  const addSwapBtn = document.getElementById('addSwapBtn');
  if(addSwapBtn) addSwapBtn.onclick = async ()=>{
    const date = document.getElementById('swapDate').value;
    const staffId = document.getElementById('swapPerson').value;
    if(!date || !staffId){ toast('請選擇日期與同仁'); return; }
    if(!state.month.shiftSwaps) state.month.shiftSwaps = [];
    if(state.month.shiftSwaps.some(s=>s.date===date && s.staffId===staffId)){ toast('這位同仁這天已經有調班紀錄了'); return; }
    state.month.shiftSwaps.push({id:uid(), date, staffId});
    await saveMonth();
    toast('已新增調班紀錄');
    render();
  };
  document.querySelectorAll('[data-del-swap]').forEach(el=>{
    el.onclick = async ()=>{
      state.month.shiftSwaps = (state.month.shiftSwaps||[]).filter(s=>s.id!==el.dataset.delSwap);
      await saveMonth();
      render();
    };
  });

  document.querySelectorAll('[data-group-add]').forEach(el=>{
    el.onchange = async ()=>{
      const gkey = el.dataset.groupAdd; const id = el.value;
      if(!id) return;
      if(!state.month.groups[gkey].includes(id)) state.month.groups[gkey].push(id);
      await saveMonth(); render();
    };
  });
  document.querySelectorAll('[data-group-remove]').forEach(el=>{
    el.onclick = async ()=>{
      const [gkey,id] = el.dataset.groupRemove.split('|');
      state.month.groups[gkey] = state.month.groups[gkey].filter(x=>x!==id);
      await saveMonth(); render();
    };
  });
  document.querySelectorAll('[data-roster-add]').forEach(el=>{
    el.onchange = async ()=>{
      const rkey = el.dataset.rosterAdd; const id = el.value;
      if(!id) return;
      state.month.rosters[rkey].push(id);
      await saveMonth(); render();
    };
  });
  document.querySelectorAll('[data-roster-remove]').forEach(el=>{
    el.onclick = async ()=>{
      const [rkey,idxStr] = el.dataset.rosterRemove.split('|'); const idx = Number(idxStr);
      state.month.rosters[rkey].splice(idx,1);
      await saveMonth(); render();
    };
  });
  document.querySelectorAll('[data-roster-up]').forEach(el=>{
    el.onclick = async ()=>{
      const [rkey,idxStr] = el.dataset.rosterUp.split('|'); const idx = Number(idxStr);
      if(idx<=0) return;
      const arr = state.month.rosters[rkey];
      [arr[idx-1],arr[idx]] = [arr[idx],arr[idx-1]];
      await saveMonth(); render();
    };
  });
  document.querySelectorAll('[data-roster-down]').forEach(el=>{
    el.onclick = async ()=>{
      const [rkey,idxStr] = el.dataset.rosterDown.split('|'); const idx = Number(idxStr);
      const arr = state.month.rosters[rkey];
      if(idx>=arr.length-1) return;
      [arr[idx+1],arr[idx]] = [arr[idx],arr[idx+1]];
      await saveMonth(); render();
    };
  });

  document.querySelectorAll('[data-set-anchor]').forEach(el=>{
    el.onclick = async ()=>{
      const rkey = el.dataset.setAnchor;
      const dateEl = document.getElementById('anchorDate-'+rkey);
      const personEl = document.getElementById('anchorPerson-'+rkey);
      const date = dateEl.value; const staffId = personEl.value;
      if(!date || !staffId){ toast('請選擇日期與人員'); return; }
      const roster = state.month.rosters[rkey] || [];
      const pos = roster.indexOf(staffId);
      if(pos<0){ toast('此人不在名單內'); return; }
      const freq = ROSTER_FREQ[rkey] || 'day';
      const rawIdx = freq==='week' ? globalWeekIndex(date) : globalWeekdayIndex(date);
      const n = roster.length;
      let offset = (pos - rawIdx) % n;
      if(offset<0) offset += n;
      state.rotationOffsets[rkey] = offset;
      await saveRotationOffsets();
      toast('已設定輪值起點,之後會依此接續輪替');
      render();
    };
  });

  document.querySelectorAll('[data-rot]').forEach(el=>{
    el.onchange = async ()=>{
      const [rowKey,date] = el.dataset.rot.split('|');
      setOverride(rowKey, date, el.value);
      await saveMonth(); render();
    };
  });
  document.querySelectorAll('[data-clear-rot]').forEach(el=>{
    el.onclick = async ()=>{
      const [rowKey,date] = el.dataset.clearRot.split('|');
      setOverride(rowKey, date, '');
      await saveMonth(); render();
    };
  });

  const addSharedRowBtn = document.getElementById('addSharedRowBtn');
  if(addSharedRowBtn) addSharedRowBtn.onclick = async ()=>{
    const input = document.getElementById('newSharedRow');
    const v = input.value.trim();
    if(!v){ toast('請輸入列名稱'); return; }
    if(state.month.sharedRows.includes(v)){ toast('已存在相同名稱的列'); return; }
    state.month.sharedRows.push(v);
    await saveMonth(); render();
  };
  document.querySelectorAll('[data-del-row]').forEach(el=>{
    el.onclick = async ()=>{
      const row = el.dataset.delRow;
      state.month.sharedRows = state.month.sharedRows.filter(r=>r!==row);
      Object.keys(state.month.sharedCell).forEach(k=>{ if(k.startsWith(row+'|')) delete state.month.sharedCell[k]; });
      await saveMonth(); render();
    };
  });
  document.querySelectorAll('.celltxt[data-shared]').forEach(el=>{
    el.onchange = async ()=>{
      const key = el.dataset.shared;
      state.month.sharedCell[key] = el.value;
      await saveMonth();
    };
  });
}
function bindTemp(){
  const submitBtn = document.getElementById('tlSubmit');
  if(submitBtn) submitBtn.onclick = async ()=>{
    const staffId = document.getElementById('tlStaff').value;
    const date = document.getElementById('tlDate').value;
    const type = document.getElementById('tlType').value;
    const period = document.getElementById('tlPeriod').value;
    const note = document.getElementById('tlNote').value.trim();
    if(!staffId || !date){ toast('請選擇同仁與日期'); return; }
    state.tempLeaves.push({id:uid(), staffId, date, type, period, note, status:'pending', ts:Date.now()});
    await saveTempLeaves();
    toast('已登記臨時請假');
    checkShortageAndAlert(date, teamOfStaff(staffId));
    render();
  };
  document.querySelectorAll('[data-mark-covered]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.dataset.markCovered;
      const sel = document.getElementById('coverSel-'+id);
      const coverId = sel ? sel.value : '';
      if(!coverId){ toast('請先選擇支援人員'); return; }
      const rec = state.tempLeaves.find(t=>t.id===id);
      rec.status = 'covered'; rec.coverStaffId = coverId;
      const rotations = rotationsOf(rec.staffId, rec.date);
      rotations.forEach(r=> setOverride(r.key, rec.date, coverId));
      await Promise.all([saveTempLeaves(), saveMonth()]);
      toast('已安排支援並更新輪值');
      render();
    };
  });
  document.querySelectorAll('[data-del-temp]').forEach(el=>{
    el.onclick = async ()=>{
      state.tempLeaves = state.tempLeaves.filter(t=>t.id!==el.dataset.delTemp);
      await saveTempLeaves(); render();
    };
  });
}

/* ============ 初始化 ============ */
window.addEventListener('afterprint', ()=> document.body.classList.remove('print-compact'));
async function init(){
  if(!window.storage || typeof window.storage.get !== 'function'){
    showStorageUnavailableWarning();
  }
  await loadStaff();
  if(state.staff.length===0){
    state.staff = SEED_STAFF_NAMES.map(name=>({id:uid(), name}));
    await saveStaff();
  }
  // 這幾項彼此不互相依賴,平行讀取以縮短載入時間(原本是一項一項依序等待)
  await Promise.all([
    loadAdminPin(),
    loadMinStaff(),
    loadRotationOffsets(),
    loadCustomHolidays(),
    loadAllForMonth()
  ]);
  state.ready = true;
  render();
}
if(window.__storageReady){
  init();
}else{
  window.addEventListener('storage-ready', init, {once:true});
  setTimeout(()=>{
    if(!window.__storageReady){
      document.getElementById('app').innerHTML = `<div style="padding:40px 20px;text-align:center;color:#95332E;">
        <div style="font-size:32px;margin-bottom:12px;">⚠️</div>
        <div style="font-weight:700;font-size:16px;margin-bottom:10px;">雲端連線逾時,無法載入</div>
        <div style="font-size:13px;color:#6E7871;line-height:1.7;">
          可能原因:<br>
          1. 目前是用 LINE / Instagram 等 App 內建瀏覽器打開,請改用 Safari 或 Chrome 直接開啟這個網址<br>
          2. 網路連線不穩定,請檢查網路後重新整理<br>
          3. 瀏覽器擴充功能(如廣告攔截器)擋住了連線
        </div>
      </div>`;
    }
  }, 8000);
}
